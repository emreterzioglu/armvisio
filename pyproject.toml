[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armvisio"
version = "0.1.0"
description = "AI-guided cybersecurity framework for Raspberry Pi 5 + Hailo AI HAT+"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "armvisio contributors" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = [
  "textual>=0.60",
  "rich>=13.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
hailo = ["numpy>=1.26", "opencv-python-headless>=4.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
armvisio = "armvisio.__main__:main"

[tool.setuptools.packages.find]
include = ["armvisio*"]

[tool.ruff]
line-length = 100
target-version = "py310"
